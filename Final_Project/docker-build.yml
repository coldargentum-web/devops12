name: Build, Push and Update K8s

on:
  push:
    branches: [ main ]

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-test-app:${{ github.sha }}

      - name: Update Deployment manifest
        run: |
          sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/python-test-app:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/python-test-app:${{ github.sha }}|g" k8s/deployment.yaml
          
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit -am "Update image tag to ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push