groups:
  - name: general_alerts
    rules:
      - alert: InstanceDown
        # Условие: если статус цели (up) равен 0 (то есть сервис недоступен)
        expr: up == 0
        # Ждем 1 минуту, чтобы убедиться, что это не случайный скачок сети
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Внимание! Сервис {{ $labels.instance }} упал."
          description: "Сервис {{ $labels.instance }} (задача {{ $labels.job }}) недоступен уже более 1 минуты."