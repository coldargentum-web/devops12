apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-argo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/coldargentum-web/final-devops-project.git'
    targetRevision: main
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true