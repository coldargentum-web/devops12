route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'telegram_bot'

receivers:
- name: 'telegram_bot'
  telegram_configs:
  - bot_token: 'ВАШ_ТОКЕН_ОТ_BOTFATHER'
    api_url: 'https://api.telegram.org'
    chat_id: ВАШ_ID_ЧАТА
    parse_mode: 'HTML'
    message: "🚨 <b>АЛЕРТ!</b>\nИмя: {{ .GroupLabels.alertname }}\: {{ .CommonAnnotations.description }}"